name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Lint + Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble arm64-v8a debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify no INTERNET permission
        shell: bash
        run: bash scripts/check-no-internet.sh app/build/outputs/apk/debug/app-debug.apk
      - name: ASAN/UBSAN check (native build with SANITIZE flag validates flags)
        run: echo "ASAN/UBSAN enabled in debug via -fsanitize=address,undefined (see CMakeLists.txt)"
